# Stack Portainer : trois services (API, front, Proton Mail Bridge), un volume par donnée.
#
# Déploiement : créer une stack depuis ce dépôt GitHub, renseigner les variables
# d'environnement, puis déployer. Les images sont construites par la CI et publiées
# sur GHCR ; en local, remplacer `image:` par `build:` (voir docker-compose.dev.yml).

services:
  api:
    image: ghcr.io/aymericlefeyer/aylabs-creator-studio-api:${TAG:-latest}
    container_name: creator-studio-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_PATH: /app/data/creator-studio.db
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GCP_CLIENT_ID: ${GCP_CLIENT_ID:-}
      GCP_CLIENT_SECRET: ${GCP_CLIENT_SECRET:-}
      COLLECT_CRON: ${COLLECT_CRON:-0 * * * *}
      COLLECT_AT_STARTUP: ${COLLECT_AT_STARTUP:-true}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-730}
      # Le jour des tâches posées dans l'app Todo (sorties, légal) : le conteneur est en UTC.
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      # Le front appelle /api en relatif via nginx : aucune origine tierce à autoriser.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Chiffre les mots de passe saisis dans Paramètres -> API (16 caractères minimum,
      # ex. `openssl rand -base64 32`). La changer rend illisibles ceux déjà enregistrés.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Sources de l'export (facultatif) : l'environnement l'emporte sur l'écran. Mêmes
      # noms que l'ancien YouTube-Money-Exporter.
      AMAZON_LOGIN: ${AMAZON_LOGIN:-}
      AMAZON_PASSWORD: ${AMAZON_PASSWORD:-}
      AMAZON_SECRET_KEY: ${AMAZON_SECRET_KEY:-}
      DOMADOO_LOGIN: ${DOMADOO_LOGIN:-}
      DOMADOO_PASSWORD: ${DOMADOO_PASSWORD:-}
      DISCORD_SERVER_CODE: ${DISCORD_SERVER_CODE:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ANNOUNCE_CHANNEL_ID: ${DISCORD_ANNOUNCE_CHANNEL_ID:-}
      DISCORD_ANNOUNCE_ROLE_ID: ${DISCORD_ANNOUNCE_ROLE_ID:-}
      # Profil Instagram public relevé une fois par jour (@pseudo ou URL), sans compte Meta.
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      SEARCH_API_APIKEY: ${SEARCH_API_APIKEY:-}
      # Boîte mail (Admin -> Mails). Facultatifs : l'environnement l'emporte sur l'écran.
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_CRON: ${MAIL_CRON:-*/5 * * * *}
      # Assistant IA (Paramètres -> API). Facultatif, saisissable à l'écran.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - creator-studio-data:/app/data
    # Pas de ports exposés : seul nginx parle à l'API, sur le réseau interne.
    expose:
      - '3001'

  # Proton Mail Bridge : la passerelle officielle de Proton, qui expose ta boîte en IMAP/SMTP
  # classiques (Proton n'en expose aucun lui-même, tout est chiffré de bout en bout).
  # Image communautaire (github.com/shenxn/protonmail-bridge-docker) complétée de libfido2,
  # dont Bridge a besoin après sa mise à jour automatique (docker/proton-bridge/Dockerfile,
  # publiée par la CI). Abonnement Proton payant obligatoire.
  #
  # **Aucun port publié** : seul le conteneur de l'API lui parle, par le réseau interne,
  # sur `protonmail-bridge` — IMAP 143, SMTP 25, STARTTLS avec un certificat auto-signé.
  #
  # Connexion à faire UNE fois, sur le VPS (la session vit ensuite dans le volume) :
  #   1. déployer la stack, puis arrêter ce seul conteneur (deux Bridge ne peuvent pas
  #      ouvrir le même volume) : docker stop creator-studio-proton-bridge
  #   2. docker run --rm -it -v creator-studio-proton:/root ghcr.io/aymericlefeyer/aylabs-creator-studio-proton-bridge:latest init
  #        > login   (adresse Proton, mot de passe, code 2FA)
  #        > info    (note le « Username » et le « Password » générés par Bridge)
  #        > exit
  #   3. docker start creator-studio-proton-bridge
  #   4. Paramètres -> Admin -> Mails -> préréglage « Proton (Bridge) », avec CES identifiants
  #      (le mot de passe de Bridge, jamais celui du compte Proton).
  protonmail-bridge:
    image: ghcr.io/aymericlefeyer/aylabs-creator-studio-proton-bridge:${TAG:-latest}
    container_name: creator-studio-proton-bridge
    restart: unless-stopped
    volumes:
      - creator-studio-proton:/root
    expose:
      - '25'
      - '143'

  web:
    image: ghcr.io/aymericlefeyer/aylabs-creator-studio-web:${TAG:-latest}
    container_name: creator-studio-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3001
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  creator-studio-data:
    name: creator-studio-data
  # La session Proton Mail Bridge (clés, cache). La perdre oblige à refaire le `login`.
  creator-studio-proton:
    name: creator-studio-proton
