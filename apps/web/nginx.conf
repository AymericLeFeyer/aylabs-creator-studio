server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Les assets portent un hash dans leur nom : ils sont immuables.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le service worker ne doit JAMAIS être servi depuis le cache HTTP : c'est lui qui
    # décide de tout le reste, et une version figée par un cache d'un an rendrait
    # l'application impossible à mettre à jour sans vider le navigateur à la main.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Même raison pour la coquille : c'est elle qui référence les assets hachés du
    # dernier déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # `default_type` et NON un bloc `types` : au niveau `server`, un bloc `types`
    # remplace la table MIME entière héritée de `http` (`include mime.types`) au lieu de
    # la compléter — plus de text/html, plus de text/css, et le navigateur télécharge la
    # page au lieu de l'afficher. Ici la directive ne s'applique qu'à ce seul fichier, et
    # seulement si nginx ne connaît pas déjà l'extension (les versions récentes, si).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Icônes : elles ne changent qu'au fil des années, mais leur nom ne porte pas de
    # hash — une semaine suffit à les rendre gratuites sans figer un changement de logo.
    location ~* \.(png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # L'API tourne dans un autre conteneur ; le front l'appelle en relatif,
    # ce qui évite toute configuration CORS et tout nom d'hôte codé en dur.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une collecte de rattrapage sur deux ans peut dépasser la minute par défaut.
        proxy_read_timeout 300s;
    }

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
