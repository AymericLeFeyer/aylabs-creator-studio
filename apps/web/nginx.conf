server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les assets portent un hash dans leur nom : ils sont immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # L'API tourne dans un autre conteneur ; le front l'appelle en relatif,
    # ce qui évite toute configuration CORS et tout nom d'hôte codé en dur.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une collecte de rattrapage sur deux ans peut dépasser la minute par défaut.
        proxy_read_timeout 300s;
    }

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
